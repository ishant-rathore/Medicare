name: Medicare CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate documentation files
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/README.md
          for dir in docs/01-project docs/02-requirements docs/03-architecture docs/04-ui-ux docs/05-frontend docs/06-backend docs/07-database docs/08-api docs/09-security docs/10-deployment docs/11-testing docs/12-community-engagement docs/13-user-documentation docs/14-release docs/15-final-submission; do
            test -d "$dir"
          done
          find docs -type f -name '*.md' -print0 | xargs -0 -n1 test -r

  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Type Check
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: dummy_secret_for_tests
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medicare_test

  frontend-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test
