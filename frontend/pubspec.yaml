name: medicare
description: Medicare – Voice Reminders for Senior Citizens. Offline-first Android medication reminder app.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ─── Local Database (SQLite) ──────────────────────────────────────────────
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # ─── HTTP / Networking ────────────────────────────────────────────────────
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # ─── Firebase ─────────────────────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.0.4
  firebase_storage: ^12.1.3

  # ─── Notifications & Alarms ───────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2
  android_alarm_manager_plus: ^3.1.3
  flutter_background_service: ^5.0.5

  # ─── Voice (TTS & STT) ────────────────────────────────────────────────────
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.2
  permission_handler: ^11.3.1

  # ─── UI & Accessibility ───────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # ─── Form & Validation ───────────────────────────────────────────────────
  flutter_form_builder: ^9.4.0
  form_builder_validators: ^10.0.1

  # ─── Utilities ────────────────────────────────────────────────────────────
  uuid: ^4.4.2
  intl: ^0.19.0
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  rxdart: ^0.28.0
  collection: ^1.18.0

  # ─── Media ────────────────────────────────────────────────────────────────
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  mockito: ^5.4.4
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/localization/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
